spring:
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000
  datasource:
    url: jdbc:mysql://localhost:3306/redis_db
    username: redis
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
#    show-sql: true
#    generate-ddl: true
    database: mysql
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
#        format_sql: true